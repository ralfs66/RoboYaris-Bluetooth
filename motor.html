<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Motor</title>
<style>
  html, body { margin: 0; height: 100%; background: #121418; color: #f2f4f8;
    font-family: sans-serif; touch-action: none; user-select: none; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: 0.04em; }
  p { margin: 0; color: #9aa3b2; font-size: 16px; }
  #padname { color: #6d7688; font-size: 13px; letter-spacing: 0.04em; }
  #dirs { display: flex; gap: 14px; width: min(92vw, 440px); }
  #dirs button { flex: 1; height: min(24vh, 148px); border: 0; border-radius: 22px;
    background: #e7ecf5; color: #121418; font: 700 32px sans-serif; letter-spacing: 0.08em;
    touch-action: none; }
  #dirs button.held { background: #8ea0bf; }
  #pad { width: min(62vw, 250px); height: min(62vw, 250px); border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #2a3140, #1a1e27 70%);
    box-shadow: inset 0 0 0 2px #3a4254, 0 12px 40px rgba(0,0,0,.35);
    position: relative; }
  #knob { width: 34%; height: 34%; border-radius: 50%; background: #e7ecf5;
    position: absolute; left: 33%; top: 33%; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
  .side { position: absolute; top: 46%; width: 26%; text-align: center; color: #6d7688;
    font-size: 12px; letter-spacing: 0.06em; }
  .ccw { left: 1%; } .cw { right: 1%; }
  #pedals { display: flex; gap: 22px; width: min(78vw, 320px); }
  .pedal { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .pedal span { font-size: 13px; letter-spacing: 0.08em; color: #9aa3b2; }
  .pedal b { font-weight: 650; color: #f2f4f8; }
  input[type=range] { width: 100%; touch-action: pan-x; accent-color: #e7ecf5; }
  #gears { display: flex; gap: 10px; width: min(78vw, 320px); }
  #gears button { flex: 1; height: 52px; border: 0; border-radius: 14px;
    background: #2a3140; color: #f2f4f8; font: 700 20px sans-serif; letter-spacing: 0.06em; }
  #gears button.held { background: #e7ecf5; color: #121418; }
</style>
</head>
<body>
<main>
  <div>
    <h1 id="title">STOP</h1>
    <p id="sub">hold left or right</p>
    <p id="padname">usb drive</p>
  </div>
  <div id="dirs">
    <button id="btnLeft" type="button">LEFT</button>
    <button id="btnRight" type="button">RIGHT</button>
  </div>
  <div id="pad">
    <span class="side ccw">LEFT</span>
    <span class="side cw">RIGHT</span>
    <div id="knob"></div>
  </div>
  <div id="gears">
    <button type="button" data-gear="0" class="held">P</button>
    <button type="button" data-gear="1">R</button>
    <button type="button" data-gear="2">N</button>
    <button type="button" data-gear="3">D</button>
  </div>
  <div id="pedals">
    <label class="pedal">
      <span>GAS <b id="gasVal">0</b></span>
      <input id="gas" type="range" min="0" max="100" value="0">
    </label>
    <label class="pedal">
      <span>BRAKE <b id="brakeVal">0</b></span>
      <input id="brake" type="range" min="0" max="100" value="0">
    </label>
  </div>
</main>
<script>
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const gasEl = document.getElementById('gas');
const brakeEl = document.getElementById('brake');
const gasVal = document.getElementById('gasVal');
const brakeVal = document.getElementById('brakeVal');
const padName = document.getElementById('padname');
let pointer = null;
let inflight = false;
let dirty = false;
let sentX = 0;
let gas = 0;
let brake = 0;
let gear = 0;
let gearSet = null;
let linkFails = 0;
const heldKey = { a: false, d: false };
const heldBtn = { a: false, d: false };

function paint() {
  if (linkFails >= 2) {
    title.textContent = 'NO LINK';
    sub.textContent = 'usb stopped';
    return;
  }
  title.textContent = Math.abs(sentX) < 6 ? 'STOP' : (sentX > 0 ? 'RIGHT' : 'LEFT');
  sub.textContent = Math.abs(sentX) < 6 ? 'hold left or right' : Math.abs(sentX) + '%';
}

function send() {
  if (inflight) { dirty = true; return; }
  dirty = false;
  inflight = true;
  let url = '/joy?x=' + sentX + '&g=' + gas + '&b=' + brake;
  if (gearSet !== null) {
    url += '&gearset=' + gearSet;
    gearSet = null;
  }
  fetch(url, { cache: 'no-store' }).then(function () {
    linkFails = 0;
    inflight = false;
    paint();
    if (dirty) send();
  }).catch(function () {
    linkFails++;
    inflight = false;
    paint();
  });
}

function knobFor(x) {
  const max = pad.getBoundingClientRect().width * 0.33;
  knob.style.transform = 'translate(' + (x / 100 * max) + 'px,0px)';
}

function home() {
  knob.style.transform = 'translate(0px,0px)';
  sentX = 0;
  paint();
  send();
}

function applyDir() {
  if (pointer !== null) return;
  const left = heldKey.a || heldBtn.a;
  const right = heldKey.d || heldBtn.d;
  if (left === right) home();
  else {
    sentX = left ? -100 : 100;
    knobFor(sentX);
    paint();
    send();
  }
}

function place(x, y) {
  const r = pad.getBoundingClientRect();
  const max = r.width * 0.33;
  let dx = x - (r.left + r.width / 2);
  let dy = y - (r.top + r.height / 2);
  const dist = Math.hypot(dx, dy) || 1;
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  sentX = Math.max(-100, Math.min(100, Math.round(dx / max * 100)));
  paint();
  send();
}

pad.addEventListener('pointerdown', function (e) {
  pointer = e.pointerId;
  pad.setPointerCapture(e.pointerId);
  place(e.clientX, e.clientY);
});
pad.addEventListener('pointermove', function (e) {
  if (e.pointerId === pointer) place(e.clientX, e.clientY);
});
function end(e) {
  if (e.pointerId !== pointer) return;
  pointer = null;
  applyDir();
}
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);

function bindHold(el, key) {
  function down(e) {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    heldBtn[key] = true;
    el.classList.add('held');
    applyDir();
  }
  function up() {
    if (!heldBtn[key]) return;
    heldBtn[key] = false;
    el.classList.remove('held');
    applyDir();
  }
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindHold(document.getElementById('btnLeft'), 'a');
bindHold(document.getElementById('btnRight'), 'd');

window.addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  if (k !== 'a' && k !== 'd') return;
  e.preventDefault();
  if (e.repeat || heldKey[k]) return;
  heldKey[k] = true;
  applyDir();
});
window.addEventListener('keyup', function (e) {
  const k = e.key.toLowerCase();
  if (k !== 'a' && k !== 'd') return;
  heldKey[k] = false;
  applyDir();
});
window.addEventListener('blur', function () {
  heldKey.a = false;
  heldKey.d = false;
  heldBtn.a = false;
  heldBtn.d = false;
  document.getElementById('btnLeft').classList.remove('held');
  document.getElementById('btnRight').classList.remove('held');
  pointer = null;
  home();
});
window.addEventListener('pointerup', function () {
  if (!heldBtn.a && !heldBtn.d) return;
  heldBtn.a = false;
  heldBtn.d = false;
  document.getElementById('btnLeft').classList.remove('held');
  document.getElementById('btnRight').classList.remove('held');
  applyDir();
});

function setPedal(which, value) {
  value = Math.max(0, Math.min(100, value));
  if (which === 'g') { gas = value; gasVal.textContent = value; }
  else { brake = value; brakeVal.textContent = value; }
  send();
}
gasEl.addEventListener('input', function () { setPedal('g', +gasEl.value); });
brakeEl.addEventListener('input', function () { setPedal('b', +brakeEl.value); });

document.querySelectorAll('#gears button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    gear = +btn.dataset.gear;
    gearSet = gear;
    document.querySelectorAll('#gears button').forEach(function (other) {
      other.classList.toggle('held', other === btn);
    });
    send();
  });
});

function pollPad() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) gp = list[i];
  if (!gp) {
    padName.textContent = 'usb drive';
    return;
  }
  padName.textContent = gp.id.replace(/\s*\(.*/, '');
  if (pointer !== null) return;
  const b = gp.buttons;
  const r2 = b[7] ? Math.round(Math.max(0, Math.min(1, b[7].value)) * 100) : 0;
  const l2 = b[6] ? Math.round(Math.max(0, Math.min(1, b[6].value)) * 100) : 0;
  if (r2 !== gas) { gas = r2; gasEl.value = r2; gasVal.textContent = r2; }
  if (l2 !== brake) { brake = l2; brakeEl.value = l2; brakeVal.textContent = l2; }
}
window.addEventListener('gamepadconnected', pollPad);
requestAnimationFrame(function loop() { pollPad(); requestAnimationFrame(loop); });
setInterval(send, 40);
</script>
</body>
</html>
